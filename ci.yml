Global:
  version: 2.0

Default:
  profile: [build-docs]

Profiles:
  - profile:
    name: build-docs
    mode: AGENT
    environment:
      cluster: DECK_STD_CENTOS7
      resourceType: MEDIUM
      tools:
        - nodejs: 20.latest
        - yarn: 1.22.22
    build:
      command: sh ./scripts/build-docs.sh
      cache:
          enable: true              # 开启缓存
    artifacts:
      release: true